name: Release

# The tag is the version, and nothing in the repository records it. `v0.2.0`
# publishes spinal-plug@0.2.0 to npm and attaches the same bundle to the GitHub
# Release: no version is edited by hand, no pull request bumps one, and no commit
# goes back to a branch. npm reads the version from the tarball this job builds,
# and both plugin hosts version a plugin by the commit they fetched — so a tag is
# the only thing a release needs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No version here: action-setup reads packageManager from package.json,
      # and a hardcoded copy that drifts from it fails the run outright.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Take the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: pnpm verify
      - run: pnpm build:release
        env:
          SPINAL_PLUG_RELEASE_VERSION: ${{ steps.version.outputs.value }}

      # Trusted publishing (OIDC), not a token. npm is retiring 2FA-bypass
      # tokens: they lose account management in August 2026 and direct publishing
      # around January 2027. OIDC needs no stored credential at all — the runner
      # exchanges a short-lived, workflow-scoped identity — and it requires npm
      # >= 11.5.1, which Node 22 does not ship.
      - run: npm install -g npm@latest
      # A version npm already has is not an error: the first release of a package
      # is published by hand, because trusted publishing can only be configured on
      # a package that exists. Skipping is also what makes a re-run safe.
      - name: Check whether npm already has this version
        id: published
        run: |
          name="$(node -p "require('./release/npm/package.json').name")"
          if npm view "$name@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "$name@${{ steps.version.outputs.value }} is already on npm; the publish step will be skipped."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: ${{ steps.published.outputs.exists == 'false' && !contains(github.ref_name, '-') }}
        run: npm publish ./release/npm --access public
      - name: Publish a prerelease to npm
        if: ${{ steps.published.outputs.exists == 'false' && contains(github.ref_name, '-') }}
        run: npm publish ./release/npm --access public --tag next

      - name: Attach the bundle to the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" ./release/npm/spinal-plug.mjs --generate-notes --verify-tag || gh release upload "$GITHUB_REF_NAME" ./release/npm/spinal-plug.mjs --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
