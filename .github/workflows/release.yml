name: Release

# A tag is the release trigger: v0.1.1 publishes @spinal-plug/cli@0.1.1 and
# attaches the same bundle to the GitHub Release. The tag must match the version
# in packages/cli/package.json, so a forgotten version bump fails here instead of
# publishing the previous build under a new number.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No version here: action-setup reads packageManager from package.json,
      # and a hardcoded copy that drifts from it fails the run outright.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build:release
      - name: Check the tag against the repository version
        # `pnpm check:plugins` already holds the CLI and both plugins to one
        # version, so comparing the tag against the built manifest pins all three:
        # a tag names one release of the whole client, not of one artifact.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./release/npm/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      # Trusted publishing (OIDC), not a token. npm is retiring 2FA-bypass
      # tokens: they lose account management in August 2026 and direct publishing
      # around January 2027. OIDC needs no stored credential at all — the runner
      # exchanges a short-lived, workflow-scoped identity — and it requires npm
      # >= 11.5.1, which Node 22 does not ship.
      - run: npm install -g npm@latest
      # The first release of a new package is published by hand — trusted
      # publishing can only be configured on a package that exists — so the tag
      # for it would otherwise fail here on a version npm already has. Skipping is
      # also what makes re-running a release job safe.
      - name: Check whether npm already has this version
        id: published
        run: |
          name="$(node -p "require('./release/npm/package.json').name")"
          version="$(node -p "require('./release/npm/package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; the publish step will be skipped."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: ${{ steps.published.outputs.exists == 'false' && !contains(github.ref_name, '-') }}
        run: npm publish ./release/npm --access public
      - name: Publish a prerelease to npm
        if: ${{ steps.published.outputs.exists == 'false' && contains(github.ref_name, '-') }}
        run: npm publish ./release/npm --access public --tag next
      - name: Attach the bundle to the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" ./release/npm/spinal-plug.mjs --generate-notes --verify-tag || gh release upload "$GITHUB_REF_NAME" ./release/npm/spinal-plug.mjs --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
